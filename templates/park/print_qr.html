<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard QR card</title>
    <style>
        body { margin: 0; background: #e9ebf1; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #111; }
        .sheet { padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
        .card {
            width: 90mm; background: #fff; border: 2px solid #111; border-radius: 14px; padding: 18px 16px;
            text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }
        .card h1 { margin: 0 0 4px; font-size: 20px; }
        .card p { margin: 0; font-size: 13px; color: #333; }
        .card img { width: 62mm; height: 62mm; margin: 12px auto; display: block; image-rendering: pixelated; }
        .card .foot { font-size: 11px; color: #666; margin-top: 4px; }
        button { padding: 10px 18px; border-radius: 8px; border: 0; background: #2f7fd1; color: #fff; font-weight: 600; cursor: pointer; }
        @media print {
            body { background: #fff; }
            .sheet { padding: 0; }
            .card { box-shadow: none; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>
<div class="sheet">
    <div class="card">
        <h1>🚗 Need me to move?</h1>
        <p>Scan to notify the owner instantly.</p>
        <img src="{{ qr_png }}" alt="QR code">
        <p><strong>No app needed</strong> · Your number stays private unless you share it</p>
        <div class="foot">Place face-up on the dashboard</div>
    </div>
    <div class="no-print" style="display:flex;gap:10px">
        <button type="button" onclick="window.print()">Print</button>
        <button type="button" data-lang-toggle aria-label="Language"></button>
    </div>
</div>
{% include "park/_i18n.html" %}
</body>
</html>
