{# Shared full-screen call UI (WhatsApp-style) + WebRTC helpers.
   Included by park/scan.html (caller) and park/call.html (owner). #}
<style>
    .call-screen {
        position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center;
        padding: max(28px, env(safe-area-inset-top)) 20px max(36px, env(safe-area-inset-bottom));
        background: radial-gradient(120% 70% at 50% 0%, #1f4f47 0%, #0f2a27 45%, #0b141a 100%);
        color: #e9edef; text-align: center; overflow: hidden;
    }
    .call-screen.show { display: flex; animation: callIn .3s ease both; }
    .call-e2e { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: #8696a0; }
    .call-e2e svg { width: 12px; height: 12px; }
    .call-name { font-size: 1.6rem; font-weight: 600; margin: 18px 0 4px; overflow-wrap: anywhere; }
    .call-sub { font-size: .9rem; color: #8696a0; min-height: 1.4em; }
    .call-status { font-size: 1rem; color: #d1d7db; margin-top: 6px; min-height: 1.5em; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
    .call-avatar-wrap { position: relative; width: 168px; height: 168px; margin: auto 0; }
    .call-avatar {
        position: absolute; inset: 14px; border-radius: 50%; background: #2a3942; display: grid; place-items: center;
        font-size: 64px; box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    .call-pulse { position: absolute; inset: 14px; border-radius: 50%; border: 2px solid rgba(0,168,132,.55); opacity: 0; }
    .call-screen.ringing .call-pulse { animation: callPulse 2.2s ease-out infinite; }
    .call-screen.ringing .call-pulse:nth-child(2) { animation-delay: .73s; }
    .call-screen.ringing .call-pulse:nth-child(3) { animation-delay: 1.46s; }
    .call-controls { display: flex; gap: 34px; justify-content: center; align-items: flex-start; }
    .call-ctl { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .8rem; color: #d1d7db; }
    .call-btn {
        width: 64px; height: 64px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer;
        background: rgba(255,255,255,.12); color: #fff; transition: transform .12s ease, background .2s ease;
    }
    .call-btn:active { transform: scale(.92); }
    .call-btn:disabled { opacity: .45; cursor: default; }
    .call-btn svg { width: 28px; height: 28px; fill: currentColor; }
    .call-btn.on { background: #e9edef; color: #0b141a; }
    .call-btn.end { background: #f15c6d; }
    .call-btn.end svg { transform: rotate(135deg); }
    .call-btn.accept { background: #00a884; animation: callNudge 1.4s ease-in-out infinite; }
    .call-btn[hidden], .call-ctl[hidden] { display: none; }
    @keyframes callIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: none; } }
    @keyframes callPulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }
    @keyframes callNudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) {
        .call-screen.show, .call-screen.ringing .call-pulse, .call-btn.accept { animation: none !important; }
    }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="ic-mic" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></symbol>
    <symbol id="ic-mic-off" viewBox="0 0 24 24"><path d="M19 11h-2c0 .74-.16 1.43-.43 2.05l1.47 1.47A6.9 6.9 0 0 0 19 11zm-4.02.17V5a3 3 0 0 0-5.96-.47l5.96 5.96v.68zM4.27 3 3 4.27l6 6V11a3 3 0 0 0 4.47 2.61l1.66 1.66A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.92V21h2v-3.08a6.9 6.9 0 0 0 2.54-.9L19.73 21 21 19.73 4.27 3z"/></symbol>
    <symbol id="ic-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/></symbol>
</svg>
<script>
/* Minimal WebRTC audio-call helpers. Signalling is non-trickle: each side waits for ICE
   gathering, then sends one complete SDP through the server (park_calls row). */
window.ParkCall = (function () {
    function supported() {
        return !!(window.RTCPeerConnection && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }
    function getMic() {
        return navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false
        });
    }
    function newPeer(iceServers, stream, audioEl, onState) {
        const pc = new RTCPeerConnection({ iceServers });
        stream.getTracks().forEach((t) => pc.addTrack(t, stream));
        pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; audioEl.play().catch(() => {}); };
        pc.oniceconnectionstatechange = () => onState && onState(pc.iceConnectionState);
        return pc;
    }
    function iceGathered(pc, maxMs) {
        return new Promise((resolve) => {
            if (pc.iceGatheringState === 'complete') { resolve(); return; }
            const t = setTimeout(resolve, maxMs || 4000);
            pc.addEventListener('icegatheringstatechange', () => {
                if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
            });
        });
    }
    function stopAll(stream, pc) {
        try { if (pc) pc.close(); } catch (e) { /* closed */ }
        if (stream) stream.getTracks().forEach((t) => t.stop());
    }
    // Must be created inside the click handler so mobile browsers allow sound.
    function audioContext() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { const ctx = new AC(); if (ctx.resume) ctx.resume(); return ctx; } catch (e) { return null; }
    }
    // Ringback tone heard by the caller while the owner's phone rings (400+450 Hz double ring).
    function ringback(ctx) {
        if (!ctx) return () => {};
        const gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
        const oscs = [400, 450].map((f) => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(gain); o.start(); return o; });
        function cycle() {
            const t = ctx.currentTime, g = gain.gain, v = 0.08;
            g.setValueAtTime(v, t); g.setValueAtTime(0, t + 0.4);
            g.setValueAtTime(v, t + 0.6); g.setValueAtTime(0, t + 1.0);
        }
        cycle();
        const iv = setInterval(cycle, 3000);
        return function stop() {
            clearInterval(iv);
            try { oscs.forEach((o) => o.stop()); gain.disconnect(); } catch (e) { /* stopped */ }
        };
    }
    function clock(el) {
        let iv = null, started = 0;
        const fmt = (s) => { const m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + String(s % 60).padStart(2, '0'); };
        return {
            start() { if (iv) return; started = Date.now(); el.textContent = '00:00'; iv = setInterval(() => { el.textContent = fmt(Math.floor((Date.now() - started) / 1000)); }, 1000); },
            stop() { clearInterval(iv); iv = null; },
            running() { return !!iv; }
        };
    }
    function bindMute(btn, getStream) {
        btn.addEventListener('click', () => {
            const s = getStream(); if (!s) return;
            const muted = !btn.classList.contains('on');
            s.getAudioTracks().forEach((t) => { t.enabled = !muted; });
            btn.classList.toggle('on', muted);
            btn.setAttribute('aria-pressed', muted);
            btn.querySelector('use').setAttribute('href', muted ? '#ic-mic-off' : '#ic-mic');
        });
    }
    // Hang-up that still works while the page is closing (beacon carries the CSRF token as a form field).
    function beaconEnd(url) {
        const fd = new FormData();
        fd.append('csrf_token', document.querySelector('meta[name="csrf-token"]').content);
        try { navigator.sendBeacon(url, fd); } catch (e) { /* best effort */ }
    }
    return { supported, getMic, newPeer, iceGathered, stopAll, audioContext, ringback, clock, bindMute, beaconEnd };
})();
</script>
