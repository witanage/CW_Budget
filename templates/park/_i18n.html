        'Locating…': 'ස්ථානය සොයමින්…', 'Not supported on this device': 'මෙම උපාංගයේ සහාය නොදක්වයි',
        'Location not shared': 'ස්ථානය බෙදාගෙන නැත',
        'reCAPTCHA is not configured.': 'reCAPTCHA වින්‍යාස කර නැත.',
        'Send notification': 'දැනුම්දීම යවන්න', 'Sending…': 'යවමින්…', 'Expired': 'කල් ඉකුත් විය',
        'Notification sent!': 'දැනුම්දීම යැවිණි!', 'Owner already notified': 'හිමියාට දැනටමත් දැනුම් දී ඇත',
        'The owner has been notified. Thank you for your patience.': 'හිමියාට දැනුම් දෙන ලදී. ඔබේ ඉවසීමට ස්තූතියි.',
        'The owner has been notified.': 'හිමියාට දැනුම් දෙන ලදී.',
        'The owner was already notified moments ago.': 'හිමියාට මොහොතකට පෙර දැනටමත් දැනුම් දී ඇත.',
        'Time expired. Please scan the QR code again.': 'කාලය ඉකුත් විය. කරුණාකර QR කේතය නැවත ස්කෑන් කරන්න.',
        'Please tick "I\'m not a robot" first.': 'කරුණාකර මුලින් "I\'m not a robot" සලකුණු කරන්න.',
        'Please complete the "I\'m not a robot" check.': 'කරුණාකර "I\'m not a robot" පරීක්ෂාව සම්පූර්ණ කරන්න.',
        'Something went wrong. Please try again.': 'යම් දෝෂයක් සිදු විය. කරුණාකර නැවත උත්සාහ කරන්න.',
        'Could not reach the owner right now. Please try again.': 'දැන් හිමියා වෙත ළඟා විය නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න.',
        'This QR code is no longer valid.': 'මෙම QR කේතය තවදුරටත් වලංගු නොවේ.',
        'This QR code is not valid': 'මෙම QR කේතය වලංගු නොවේ',
        'It may have been replaced by the vehicle owner. If you need to reach the owner, please contact the parking attendant.':
            'වාහන හිමියා විසින් එය වෙනස් කර තිබිය හැක. හිමියා හා සම්බන්ධ වීමට අවශ්‍ය නම්, කරුණාකර වාහන නැවතුම්පොළ භාරකරු අමතන්න.',

        // ---- printable QR card ----
        '🚗 Need me to move?': '🚗 මට වාහනය ඉවත් කරන්න ඕනෑද?',
        'Scan to notify the owner instantly.': 'හිමියාට වහාම දැනුම් දීමට ස්කෑන් කරන්න.',
        'No app needed': 'යෙදුමක් අවශ්‍ය නැත',
        '· Your number stays private unless you share it': '· ඔබ බෙදාගන්නේ නම් මිස ඔබේ අංකය රහසිගතව පවතී',
        'Place face-up on the dashboard': 'ඩෑෂ්බෝඩ් එක මත මුහුණ ඉහළට සිටින සේ තබන්න',
        'QR code': 'QR කේතය'
    };

    const PATTERNS = [
        [/^Invalid Sri Lankan licence plate\. Examples: (.+)$/, (m) => `වලංගු නොවන ශ්‍රී ලාංකික වාහන අංකයකි. උදාහරණ: ${m[1]}`],
        [/^Change the QR for (.+)\?$/, (m) => `${m[1]} සඳහා QR කේතය වෙනස් කරන්නද?`],
        [/^New QR issued for (.+)\. Print and replace the old sticker\.$/, (m) => `${m[1]} සඳහා නව QR කේතයක් නිකුත් කරන ලදී. මුද්‍රණය කර පැරණි ස්ටිකරය මාරු කරන්න.`],
        [/^Remove (.+)\? Its QR and scan history will be deleted\.$/, (m) => `${m[1]} ඉවත් කරන්නද? එහි QR කේතය සහ ස්කෑන් ඉතිහාසය මකා දැමෙනු ඇත.`],
        [/^(.+) added\.$/, (m) => `${m[1]} එක් කරන ලදී.`],
        [/^QR code for (.+)$/, (m) => `${m[1]} සඳහා QR කේතය`],
        [/^(\d+) alerts? · last (.+)$/, (m) => `ඇඟවීම් ${m[1]} ක් · අවසන්: ${m[2]}`],
        [/^QR issued (.+)$/, (m) => `QR නිකුත් කළේ ${m[1]}`],
        [/^Enter a whole number of minutes between (\d+) and (\d+)\.$/, (m) => `මිනිත්තු ${m[1]} ත් ${m[2]} ත් අතර පූර්ණ සංඛ්‍යාවක් ඇතුළත් කරන්න.`],
        [/^✓ Location attached \(±(\d+) m\)$/, (m) => `✓ ස්ථානය අමුණා ඇත (±${m[1]} m)`],
        [/^Unnamed \((.+)\)$/, (m) => `නම නැත (${m[1]})`]
    ];

    const root = document.documentElement;
    let lang = 'en';
    try {
        const saved = localStorage.getItem('park_lang');
        lang = saved === 'si' || saved === 'en' ? saved : ((navigator.language || '').toLowerCase().startsWith('si') ? 'si' : 'en');
    } catch (e) { /* storage blocked */ }
    root.setAttribute('lang', lang);

    const norm = (s) => s.replace(/\s+/g, ' ').trim();
    function tOne(s) {
        const k = norm(s);
        if (!k) return s;
        if (Object.prototype.hasOwnProperty.call(SI, k)) return SI[k];
        for (const [re, fn] of PATTERNS) { const m = k.match(re); if (m) return fn(m); }
        return s;
    }
    // Public helper: translate a string (paragraphs separated by blank lines are handled one by one).
    window.parkT = function (s) {
        if (lang !== 'si' || typeof s !== 'string') return s;
        const whole = tOne(s);
        return whole !== s ? whole : s.split('\n\n').map(tOne).join('\n\n');
    };

    const ATTRS = ['placeholder', 'aria-label', 'title', 'alt'];
    function translateNode(n) {
        if (n.nodeType === 3) {
            const v = n.nodeValue, out = window.parkT(v.trim());
            if (out !== v.trim()) n.nodeValue = v.match(/^\s*/)[0] + out + v.match(/\s*$/)[0];
        } else if (n.nodeType === 1) {
            if (n.tagName === 'SCRIPT' || n.tagName === 'STYLE') return;
            ATTRS.forEach((a) => { if (n.hasAttribute(a)) { const v = n.getAttribute(a), o = window.parkT(v); if (o !== v) n.setAttribute(a, o); } });
            n.childNodes.forEach(translateNode);
        }
    }

    function paintToggle() {
        document.querySelectorAll('[data-lang-toggle]').forEach((b) => {
            b.textContent = lang === 'si' ? 'EN' : 'සිං';
            b.setAttribute('aria-label', lang === 'si' ? 'Switch to English' : 'සිංහලට මාරු වන්න');
            b.setAttribute('title', b.getAttribute('aria-label'));
        });
    }
    document.addEventListener('click', (e) => {
        if (!e.target.closest('[data-lang-toggle]')) return;
        try { localStorage.setItem('park_lang', lang === 'si' ? 'en' : 'si'); } catch (err) { /* storage blocked */ }
        location.reload();
    });

    paintToggle();
    if (lang !== 'si') return;
    document.title = window.parkT(document.title);
    translateNode(document.body);
    new MutationObserver((muts) => {
        for (const m of muts) {
            if (m.type === 'attributes') { translateNode(m.target); continue; }
            m.addedNodes.forEach(translateNode);
        }
    }).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ATTRS });
    // Toggle labels are written after the first pass; keep them in the right language.
    paintToggle();
})();
</script>
