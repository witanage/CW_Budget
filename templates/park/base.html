<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="strict-origin">
    <meta name="robots" content="noindex, nofollow">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}Park Notify{% endblock %}</title>
    <!-- Apply saved theme before paint to avoid a flash (same key as the budget app) -->
    <script>
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'light' ? 'light' : 'dark'); }
        catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <style>
        /* Same palette and switching mechanism as the budget app (data-theme + localStorage "theme"). */
        :root, :root[data-theme="dark"] {
            --bg: #101116; --surface: #16171e; --surface-2: #1d1e27; --border: #262836;
            --text: #e6e6e0; --muted: #9aa1c9; --accent: #61afef; --accent-ink: #0c0d11;
            --ok: #50fa7b; --warn: #ffb86c; --danger: #ff5555; --radius: 12px;
            color-scheme: dark;
        }
        :root[data-theme="light"] {
            --bg: #f4f7fa; --surface: #ffffff; --surface-2: #f4f7fa; --border: #e2e8f0;
            --text: #1f2937; --muted: #4b5563; --accent: #2563eb; --accent-ink: #ffffff;
            --ok: #15803d; --warn: #b45309; --danger: #b91c1c;
            color-scheme: light;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: var(--bg); color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Sinhala", sans-serif;
            min-height: 100vh;
        }
        a { color: var(--accent); }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .narrow { max-width: 440px; margin: 0 auto; padding: 24px 16px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .card + .card { margin-top: 16px; }
        h1, h2, h3 { margin: 0 0 12px; line-height: 1.25; }
        h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
        .muted { color: var(--muted); }
        .small { font-size: .85rem; }
        label { display: block; font-weight: 600; margin: 12px 0 6px; font-size: .9rem; }
        input, select, textarea {
            width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text); font: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
        textarea { resize: vertical; min-height: 70px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface-2); color: var(--text); font: inherit; font-weight: 600;
            cursor: pointer; text-decoration: none; white-space: nowrap;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .btn-danger { color: var(--danger); }
        .btn-sm { padding: 6px 10px; font-size: .85rem; }
        .btn-block { width: 100%; margin-top: 18px; }
        .alert { padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-size: .9rem; display: none; }
        .alert.show { display: block; }
        .alert-error { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
        .alert-ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
        .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .spacer { flex: 1; }
        .recaptcha { margin-top: 16px; min-height: 78px; }
        .theme-toggle-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text);
            width: 34px; height: 34px; padding: 0; display: inline-flex; align-items: center;
            justify-content: center; border-radius: 999px; cursor: pointer; transition: all .3s ease;
        }
        .theme-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
        .theme-toggle-float { position: fixed; top: 12px; right: 12px; z-index: 50; background: var(--surface); }
        ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
        ::view-transition-old(root) { z-index: 1; }
        ::view-transition-new(root) { z-index: 2; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .brand-mark {
            width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink);
            display: grid; place-items: center; font-weight: 800;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
{% block theme_toggle %}<button type="button" class="theme-toggle-btn theme-toggle-float" data-theme-toggle aria-label="Switch theme"></button>{% endblock %}
{% block body %}{% endblock %}
<script>
    // Theme toggle: same behaviour as the budget app (circular reveal, saved under "theme").
    (function () {
        const A = 'viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
        const MOON = `<svg ${A}><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10Z"></path></svg>`;
        const SUN = `<svg ${A}><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path></svg>`;
        const root = document.documentElement;
        function paint(theme) {
            const label = theme === 'light' ? 'Switch to dark' : 'Switch to light';
            document.querySelectorAll('[data-theme-toggle]').forEach((b) => {
                b.innerHTML = theme === 'light' ? MOON : SUN;
                b.setAttribute('aria-label', label); b.setAttribute('title', label);
            });
        }
        function apply(theme) {
            root.setAttribute('data-theme', theme);
            try { localStorage.setItem('theme', theme); } catch (e) { /* storage blocked */ }
            paint(theme);
        }
        paint(root.getAttribute('data-theme'));
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('[data-theme-toggle]');
            if (!btn) return;
            const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (!document.startViewTransition || reduce) { apply(next); return; }
            const r = btn.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
            const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
            document.startViewTransition(() => apply(next)).ready.then(() => {
                root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${radius}px at ${x}px ${y}px)`] },
                    { duration: 600, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' });
            });
        });
        // Keep tabs in sync if the theme is changed in another tab (e.g. the budget app).
        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') { const t = e.newValue === 'light' ? 'light' : 'dark'; root.setAttribute('data-theme', t); paint(t); }
        });
    })();
</script>
<script>
    // Shared fetch helper: same-origin JSON with CSRF header.
    window.parkFetch = async function (url, opts = {}) {
        const headers = Object.assign({
            'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
            'Accept': 'application/json'
        }, opts.headers || {});
        let body = opts.body;
        if (body && !(body instanceof FormData) && typeof body !== 'string') {
            headers['Content-Type'] = 'application/json';
            body = JSON.stringify(body);
        }
        const res = await fetch(url, Object.assign({}, opts, { headers, body, credentials: 'same-origin' }));
        let data = {};
        try { data = await res.json(); } catch (_) { /* non-JSON */ }
        if (res.status === 429) data.error = data.message || 'Too many attempts. Please wait and try again.';
        return { ok: res.ok, status: res.status, data };
    };
    window.showAlert = function (el, msg, kind) {
        el.textContent = msg;
        el.className = 'alert show ' + (kind === 'ok' ? 'alert-ok' : 'alert-error');
    };
</script>
{% block scripts %}{% endblock %}
</body>
</html>
